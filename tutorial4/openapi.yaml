openapi: 3.0.3

info:
  title: CampusEats Orders API
  version: 1.0.0
  description: REST API for managing CampusEats orders

servers:
  - url: http://localhost:5000

paths:

  /orders:
    post:
      summary: Create a new order
      operationId: createOrder

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URL of the newly created order
              schema:
                type: string

        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: Order rejected by the domain
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      summary: List orders
      operationId: listOrders

      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string

        - name: status
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'


  /orders/{orderId}:
    get:
      summary: Get one order
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'


  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: ID of the order to cancel
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Order cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem' 

components:
  schemas:

    CreateOrderRequest:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: string

        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'


    OrderItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string

        quantity:
          type: integer
          minimum: 1


    Order:
      type: object
      properties:
        order_id:
          type: string

        customer_id:
          type: string

        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

        status:
          type: string


    OrderItem:
      type: object
      properties:
        item_id:
          type: string

        quantity:
          type: integer


    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string